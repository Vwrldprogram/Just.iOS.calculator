<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just iOS Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .container {
    background: #fff;
    padding: 25px;
    width: 92%;
    max-width: 400px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .brand-header {
    text-align: center;
    color: #1a237e;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 20px;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
    color: #333;
  }

  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 16px;
    outline: none;
  }

  /* Error Styling */
  .error-box {
    color: #d32f2f;
    background: #ffebee;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
    display: none;
    text-align: center;
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .dp-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }

  .dp-grid button {
    padding: 8px;
    border: 1px solid #1a237e;
    background: #fff;
    color: #1a237e;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  .dp-grid button.active {
    background: #1a237e;
    color: #fff;
  }

  .mode-toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  .mode-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #007bff;
    background: #fff;
    color: #007bff;
    font-weight: bold;
    cursor: pointer;
  }

  .mode-toggle button.active {
    background: #007bff;
    color: #fff;
  }

  .mode-toggle button:disabled {
    background: #e0e0e0;
    border-color: #ccc;
    color: #888;
    cursor: not-allowed;
  }

  .result-card {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    border: 2px solid #1a237e;
    margin-top: 15px;
  }

  .result-title {
    color: #1a237e;
    font-weight: 800;
    font-size: 1.2em;
    text-align: center;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .result-line {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f5f5f5;
  }

  .val { font-weight: 700; color: #000; }
  .green-val { color: #28a745; font-weight: 800; font-size: 1.1em; }
</style>
</head>
<body>

<div class="container">
  <div class="brand-header">JUST IOS</div>

  <div id="iphone-inputs">
    <label>Actual Phone Price (₦)</label>
    <input type="number" id="price-input" placeholder="0" oninput="updateDP(); populateDurations(); calc();">

    <label>Down Payment %</label>
    <div class="dp-grid">
      <button class="dp-opt" onclick="setDP(40, this)">40%</button>
      <button class="dp-opt" onclick="setDP(50, this)">50%</button>
      <button class="dp-opt active" onclick="setDP(60, this)">60%</button>
      <button class="dp-opt" onclick="setDP(70, this)">70%</button>
      <button class="dp-opt" onclick="setDP(80, this)">80%</button>
      <button class="dp-opt" onclick="setDP(90, this)">90%</button>
    </div>

    <label>Down Payment Amount (₦)</label>
    <input type="number" id="dp-input" oninput="calc()">
  </div>

  <div id="dp-error" class="error-box">⚠️ Down payment must be at least 40%!</div>

  <label>Repayment Mode</label>
  <div class="mode-toggle">
    <button id="wk-btn" class="active" onclick="setMode('weekly')">Weekly</button>
    <button id="mo-btn" onclick="setMode('monthly')">Monthly</button>
  </div>
  <div id="mode-error" class="error-box" style="display:none; margin-top:-10px; margin-bottom:15px;">40% is for weekly repayments only</div>

  <label>Duration</label>
  <select id="duration-select" onchange="calc()"></select>

  <div class="result-card">
    <div class="result-title">Just iOS Phone</div>
    
    <div id="row-price" class="result-line"><span>Actual Price</span> <span class="val" id="res-price">₦0</span></div>
    <div id="row-dp" class="result-line"><span>Down Payment</span> <span class="val" id="res-dp">₦0</span></div>
    
    <div class="result-line">
      <span id="label-mode">Weekly Payment</span>
      <span class="green-val" id="res-inst">₦0</span>
    </div>
  </div>
</div>

<script>
let currentMode = 'weekly';
let selectedDPPercent = 60;

const ipWk = { 4: 0.19, 8: 0.39, 12: 0.585, 24: 0.80 };

function getMonthRates() {
  const price = parseFloat(document.getElementById('price-input').value) || 0;
  let rates = { 1: 0.20, 2: 0.39, 3: 0.585 };
  if (price > 500000) {
    rates[6] = 0.80;
  }
  return rates;
}

function setMode(m) {
  if (selectedDPPercent === 40 && m === 'monthly') return;
  currentMode = m;
  document.getElementById('wk-btn').classList.toggle('active', m === 'weekly');
  document.getElementById('mo-btn').classList.toggle('active', m === 'monthly');
  document.getElementById('label-mode').textContent = (m === 'weekly' ? 'Weekly Payment' : 'Monthly Payment');
  populateDurations();
  calc();
}

function populateDurations() {
  const s = document.getElementById('duration-select');
  const currentVal = s.value;
  s.innerHTML = "";
  
  const source = (currentMode === 'weekly') ? ipWk : getMonthRates();
  
  Object.keys(source).forEach(k => {
    let opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k + (currentMode === 'weekly' ? " Weeks" : " Months");
    s.appendChild(opt);
  });

  if (source[currentVal]) {
    s.value = currentVal;
  }
}

function setDP(p, btn) {
  selectedDPPercent = p;
  document.querySelectorAll('.dp-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const moBtn = document.getElementById('mo-btn');
  const modeError = document.getElementById('mode-error');

  if (p === 40) {
    if (currentMode === 'monthly') {
      setMode('weekly');
    }
    moBtn.disabled = true;
    modeError.style.display = 'block';
  } else {
    moBtn.disabled = false;
    modeError.style.display = 'none';
  }

  updateDP();
  calc();
}

function updateDP() {
  const pr = parseFloat(document.getElementById('price-input').value) || 0;
  document.getElementById('dp-input').value = Math.round((selectedDPPercent/100)*pr);
}

function calc() {
  const dur = parseInt(document.getElementById('duration-select').value);
  const errorBox = document.getElementById('dp-error');
  let rate, principal, price = 0, dp = 0;

  const currentSource = (currentMode === 'weekly' ? ipWk : getMonthRates());
  rate = currentSource[dur] || 0;
  
  price = parseFloat(document.getElementById('price-input').value) || 0;
  dp = parseFloat(document.getElementById('dp-input').value) || 0;
  
  // CHECK FOR 40% ERROR
  if (price > 0 && dp < (price * 0.40)) {
    errorBox.style.display = "block";
    clearResults();
    return;
  } else {
    errorBox.style.display = "none";
  }
  
  principal = price - dp;

  const interest = Math.max(0, principal * rate);
  const total = principal + interest;
  const inst = dur > 0 ? (total / dur) : 0;

  document.getElementById('res-price').textContent = "₦" + price.toLocaleString();
  document.getElementById('res-dp').textContent = "₦" + dp.toLocaleString();
  document.getElementById('res-inst').textContent = "₦" + Math.round(inst || 0).toLocaleString();
}

function clearResults() {
  document.getElementById('res-inst').textContent = "₦0";
}

populateDurations();
</script>

</body>
</html>
